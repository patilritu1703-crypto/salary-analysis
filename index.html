
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Salary Analysis</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: #f0f4f8;
            color: #1e293b;
            margin: 0;
            padding: 30px 15px;
        }
        .container {
            max-width: 700px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 25px #00000012;
        }
        h1 { text-align: center; color: #1d4ed8; }
        p { text-align: center; color: #64748b; }
        textarea {
            width: 100%;
            height: 90px;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 13px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }
        button:hover { background: #1d4ed8; }
        .results {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-top: 24px;
        }
        .card {
            background: #eff6ff;
            padding: 18px;
            border-radius: 10px;
            text-align: center;
        }
        .card h3 { font-size: 14px; color: #475569; }
        .value { font-size: 22px; font-weight: bold; color: #1d4ed8; }
        #comparison { line-height: 1.9; overflow-wrap: anywhere; }
        .error { color: #dc2626; text-align: left; }
        @media (max-width: 450px) {
            .results { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Employee Salary Analysis</h1>
        <p>Analyze salaries and calculate important statistics.</p>

        <label for="salaries"><strong>Enter salaries separated by commas (₹):</strong></label>
        <textarea id="salaries">25000, 32000, 28000, 45000, 38000, 30000, 50000, 27000</textarea>
        <button onclick="analyzeSalaries()">Analyze Salaries</button>

        <p id="message" role="status"></p>

        <div class="results">
            <div class="card"><h3>Employees</h3><div class="value" id="count">8</div></div>
            <div class="card"><h3>Total Salary</h3><div class="value" id="total">₹275,000</div></div>
            <div class="card"><h3>Average Salary</h3><div class="value" id="average">₹34,375</div></div>
            <div class="card"><h3>Highest Salary</h3><div class="value" id="highest">₹50,000</div></div>
            <div class="card"><h3>Lowest Salary</h3><div class="value" id="lowest">₹25,000</div></div>
        </div>

        <h2>Salary Comparison</h2>
        <div id="comparison"></div>
    </div>

    <script>
        function analyzeSalaries() {
            const message = document.getElementById("message");
            const raw = document.getElementById("salaries").value.trim();

            if (!raw) {
                message.className = "error";
                message.textContent = "Please enter at least one salary.";
                return;
            }

            const parts = raw.split(",");
            const salaries = parts.map(value => value.trim());

            if (salaries.some(value => value === "" || !Number.isFinite(Number(value)) || Number(value) < 0)) {
                message.className = "error";
                message.textContent = "Enter valid, non-negative numbers separated by commas.";
                return;
            }

            const numbers = salaries.map(Number);
            const total = numbers.reduce((sum, salary) => sum + salary, 0);
            const average = total / numbers.length;
            const money = value => "₹" + value.toLocaleString("en-IN", {
                maximumFractionDigits: 2
            });

            document.getElementById("count").textContent = numbers.length;
            document.getElementById("total").textContent = money(total);
            document.getElementById("average").textContent = money(average);
            document.getElementById("highest").textContent = money(Math.max(...numbers));
            document.getElementById("lowest").textContent = money(Math.min(...numbers));

            const comparison = document.getElementById("comparison");
            comparison.replaceChildren();

            numbers.forEach((salary, index) => {
                const line = document.createElement("p");
                const status = salary > average ? "Above average" :
                    salary < average ? "Below average" : "Equal to average";
                line.textContent = `Employee ${index + 1}: ${money(salary)} — ${status}`;
                comparison.appendChild(line);
            });

            message.className = "";
            message.textContent = "Analysis completed successfully!";
        }

        analyzeSalaries();
    </script>
</body>
</html>
